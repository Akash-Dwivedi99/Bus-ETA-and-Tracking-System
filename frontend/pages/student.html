<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Tracker — Student</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/student.css">
</head>
<body class="student-body">

<header class="app-bar">
  <span class="brand"><span class="dot"></span>Campus Bus Tracker</span>
  <span class="meta" id="last-updated">Connecting…</span>
</header>

<div class="layout">
  <div id="map"></div>
  <aside>
    <div class="error-banner" id="error-banner">Unable to reach the server. Retrying…</div>

    <select id="bus-select">
      <option value="">Loading buses…</option>
    </select>

    <div class="eta-hero">
      <div class="label">Estimated arrival</div>
      <div class="value" id="eta-value">—</div>
      <div class="sub" id="eta-stop-name">Waiting for data</div>
    </div>

    <div class="stat-line">
      <span class="label">Distance remaining</span>
      <span class="value" id="distance-value">— km</span>
    </div>

    <div class="stat-line">
      <span class="label">Distance to you</span>
      <span class="value" id="student-distance-value">— km</span>
    </div>

    <h2>Route stops</h2>
    <ul class="stop-list" id="stop-list">
      <li><span class="marker"></span><span class="name">Loading stops…</span></li>
    </ul>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
