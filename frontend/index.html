<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart College Bus Tracker</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🚌 Smart College Bus Tracker</h1>
        <p>Live Bus Location & Estimated Arrival Time</p>
    </header>


    <!-- Main Container -->
    <main>

        <!-- Bus Information -->
        <section class="bus-info">

            <div class="info-box">
                <h3>Bus Number</h3>
                <p>Bus 01</p>
            </div>

            <div class="info-box">
                <h3>Route</h3>
                <p>College - Main Road</p>
            </div>

            <div class="info-box">
                <h3>Status</h3>
                <p>🟢 Active</p>
            </div>

            <div class="info-box">
                <h3>ETA</h3>
                <p id="eta">-- minutes</p>
            </div>

        </section>


        <!-- Map -->
        <section class="map-section">

            <h2>📍 Live Bus Location</h2>

            <div id="map"></div>

        </section>


        <!-- Route Information -->
        <section class="route-info">

            <h2>🛣️ Bus Route</h2>

            <div class="stops">

                <div class="stop">
                    <span>🏫</span>
                    <div>
                        <strong>College</strong>
                        <p>Starting Point</p>
                    </div>
                </div>

                <div class="stop">
                    <span>📍</span>
                    <div>
                        <strong>Stop 1</strong>
                        <p>Pickup Point</p>
                    </div>
                </div>

                <div class="stop">
                    <span>📍</span>
                    <div>
                        <strong>Stop 2</strong>
                        <p>Pickup Point</p>
                    </div>
                </div>

                <div class="stop">
                    <span>📍</span>
                    <div>
                        <strong>Stop 3</strong>
                        <p>Pickup Point</p>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Our JavaScript -->
    <script src="map.js"></script>

</body>

</html>
